<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九因歌大挑戰！ (計時版 - 無 0/1)</title>
    
    <style>
        /* 基本重置和字體設定 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e6e6fa; 
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* 內容容器 */
        .container {
            background-color: #ffffff;
            padding: 30px 20px; /* 調整左右 padding */
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            max-width: 450px; 
            width: 90%;
            margin: 20px auto; /* 上下留出空間，防止被手機頂部遮擋 */
        }

        /* 標題 */
        h1 {
            color: #4a90e2;
            margin-bottom: 20px;
        }

        /* 狀態顯示板 (手機優化) */
        #status-board {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 30px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            
            /* *** 關鍵優化：在窄螢幕上將分數和時間垂直疊放 *** */
            display: block; /* 預設為區塊，垂直疊放 */
            text-align: center;
        }
        
        #score-board, #time-board {
            padding: 5px 0; /* 增加上下間距 */
            border-bottom: 1px dashed #e0e0e0; /* 分隔線 */
        }
        
        #time-board {
            border-bottom: none; /* 最後一項不需要底線 */
            padding-top: 10px;
        }
        
        .stat-value {
            font-weight: bold;
            color: #ff7f50;
        }

        /* 問題顯示區塊 */
        .question-box {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #fff0f5;
            border-radius: 10px;
            color: #333;
        }

        /* 輸入框和按鈕 */
        #answer-input {
            padding: 10px;
            font-size: 1.2em;
            width: 50%;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        /* 訊息顯示 */
        .message {
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 20px;
            min-height: 25px;
        }

        .correct {
            color: #008000;
        }

        .wrong {
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 1-9 乘數練習 🌟</h1>
        
        <div id="status-board">
            <div id="score-board">
                答對：<span id="score" class="stat-value">0</span> / 
                總題：<span id="total-questions" class="stat-value">0</span>
            </div>
            <div id="time-board">
                總用時：<span id="total-time" class="stat-value">0s</span>
            </div>
        </div>
        
        <div class="question-box">
            <span id="num1"></span> × <span id="num2"></span> = ?
        </div>
        
        <input type="number" id="answer-input" placeholder="請輸入答案" required>
        <button onclick="checkAnswer()">提交答案</button>
        
        <p id="result-message" class="message"></p >
        <p id="question-time" class="message"></p >
    </div>

    <script>
        // 全局變量
        let currentNum1 = 0;
        let currentNum2 = 0;
        let score = 0;
        let totalQuestions = 0;
        let startTime = 0;           
        let totalTimeSeconds = 0;    
        let totalTimerInterval;      

        // 獲取 DOM 元素
        const num1El = document.getElementById('num1');
        const num2El = document.getElementById('num2');
        const scoreEl = document.getElementById('score');
        const totalQuestionsEl = document.getElementById('total-questions');
        const totalTimeEl = document.getElementById('total-time');
        const inputEl = document.getElementById('answer-input');
        const resultMessageEl = document.getElementById('result-message');
        const questionTimeEl = document.getElementById('question-time');

        // 函數：更新總用時顯示
        function updateTotalTime() {
            totalTimeSeconds++;
            totalTimeEl.textContent = totalTimeSeconds + 's';
        }

        // 函數：生成新的乘數問題 (範圍：2到9)
        function generateQuestion() {
            // 記錄新問題的開始時間
            startTime = Date.now();
            questionTimeEl.textContent = ''; 

            // *** 關鍵修改：從 2 到 9 (共 8 個數字) ***
            currentNum1 = Math.floor(Math.random() * 8) + 2;
            currentNum2 = Math.floor(Math.random() * 8) + 2;
            
            num1El.textContent = currentNum1;
            num2El.textContent = currentNum2;
            
            inputEl.value = '';
            resultMessageEl.textContent = '';
            resultMessageEl.className = 'message';
            
            inputEl.focus();
        }

        // 函數：檢查用戶的答案
        function checkAnswer() {
            const userAnswer = parseInt(inputEl.value);
            const correctAnswer = currentNum1 * currentNum2;
            const endTime = Date.now();
            
            if (isNaN(userAnswer)) {
                resultMessageEl.textContent = '請輸入一個有效的數字！';
                resultMessageEl.className = 'message wrong';
                inputEl.focus();
                return;
            }

            totalQuestions++;
            totalQuestionsEl.textContent = totalQuestions;
            
            // 計算單題用時
            const timeTaken = ((endTime - startTime) / 1000).toFixed(2); 
            
            let message = '';

            if (userAnswer === correctAnswer) {
                score++;
                scoreEl.textContent = score;
                message = '✅ 太棒了！答案正確！';
                resultMessageEl.className = 'message correct';
            } else {
                message = `❌ 錯了，正確答案是 ${correctAnswer}。`;
                resultMessageEl.className = 'message wrong';
            }
            
            resultMessageEl.textContent = message;
            questionTimeEl.textContent = `這題用時: ${timeTaken} 秒`;

            // 延遲一段時間後生成新問題
            setTimeout(generateQuestion, 2000); 
        }

        // 監聽 Enter 鍵
        inputEl.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        });

        // 網頁載入完成後
        window.onload = function() {
            // 啟動總計時器，每秒更新一次
            totalTimerInterval = setInterval(updateTotalTime, 1000);
            
            // 生成第一個問題
            generateQuestion();
        }
    </script>
</body>
</html>
