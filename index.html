<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九因歌大挑戰！ (錯誤追蹤版)</title>
    
    <style>
        /* 基本重置和字體設定 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e6e6fa; 
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* 內容容器 */
        .container {
            background-color: #ffffff;
            padding: 30px 20px; 
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            max-width: 450px; 
            width: 90%;
            margin: 20px auto; 
        }

        /* 標題 */
        h1 {
            color: #4a90e2;
            margin-bottom: 20px;
        }

        /* 狀態顯示板 */
        #status-board {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 30px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            
            display: block; 
            text-align: left; 
        }
        
        .stat-item {
            padding: 5px 0;
            border-bottom: 1px dashed #e0e0e0;
            overflow: hidden; /* 確保浮動內容不會影響佈局 */
        }
        
        #accuracy-board {
            border-bottom: none;
            padding-top: 5px;
            font-weight: bold; 
        }
        
        .stat-value {
            font-weight: bold;
            color: #ff7f50;
            float: right; 
        }

        /* 問題顯示區塊 */
        .question-box {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #fff0f5;
            border-radius: 10px;
            color: #333;
        }

        /* 輸入框和按鈕 */
        #answer-input {
            padding: 10px;
            font-size: 1.2em;
            width: 50%;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 20px; /* 增加底部空間 */
        }

        button:hover {
            background-color: #45a049;
        }

        /* 訊息顯示 */
        .message {
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 20px;
            min-height: 25px;
        }

        .correct {
            color: #008000;
        }

        .wrong {
            color: #ff0000;
        }

        /* 錯誤列表樣式 */
        #error-summary {
            margin-top: 30px;
            padding: 15px;
            border: 2px solid #ff9999;
            border-radius: 10px;
            background-color: #ffeaea;
            text-align: left;
        }

        #error-list {
            list-style-type: decimal; /* 使用數字列表 */
            padding-left: 20px;
            margin-top: 10px;
            font-size: 1.0em;
        }

        #error-list li {
            margin-bottom: 5px;
            color: #cc0000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 1-9 乘數練習 🌟</h1>
        
        <div id="status-board">
            <div class="stat-item" id="time-board">
                總用時：<span id="total-time" class="stat-value">0s</span>
            </div>
            <div class="stat-item">
                總嘗試題數：<span id="total-questions" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                答對次數：<span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                答錯次數：<span id="mistakes" class="stat-value">0</span>
            </div>
            <div class="stat-item" id="accuracy-board">
                **目前準確度**：<span id="accuracy" class="stat-value">--</span>
            </div>
        </div>
        
        <div class="question-box">
            <span id="num1"></span> × <span id="num2"></span> = ?
        </div>
        
        <input type="number" id="answer-input" placeholder="請輸入答案" required>
        <button onclick="checkAnswer()">提交答案</button>
        
        <p id="result-message" class="message"></p >
        <p id="question-time" class="message"></p >

        <div id="error-summary" style="display:none;">
            <h3>🚨 錯題清單：</h3>
            <ol id="error-list"></ol>
        </div>
    </div>

    <script>
        // 全局變量
        let currentNum1 = 0;
        let currentNum2 = 0;
        let score = 0;
        let mistakes = 0; 
        let totalQuestions = 0; 
        let startTime = 0;           
        let totalTimeSeconds = 0;    
        let totalTimerInterval;      
        let errorList = []; // *** 新增：存儲錯誤題目的列表 ***

        // 獲取 DOM 元素
        const num1El = document.getElementById('num1');
        const num2El = document.getElementById('num2');
        const scoreEl = document.getElementById('score');
        const mistakesEl = document.getElementById('mistakes'); 
        const totalQuestionsEl = document.getElementById('total-questions');
        const totalTimeEl = document.getElementById('total-time');
        const accuracyEl = document.getElementById('accuracy'); 
        const inputEl = document.getElementById('answer-input');
        const resultMessageEl = document.getElementById('result-message');
        const questionTimeEl = document.getElementById('question-time');
        const errorSummaryEl = document.getElementById('error-summary'); // 新增
        const errorListEl = document.getElementById('error-list');       // 新增

        // 函數：更新總用時顯示
        function updateTotalTime() {
            totalTimeSeconds++;
            totalTimeEl.textContent = totalTimeSeconds + 's';
        }
        
        // 函數：更新準確度顯示
        function updateAccuracy() {
            if (totalQuestions === 0) {
                accuracyEl.textContent = '--';
            } else {
                const accuracyRate = (score / totalQuestions) * 100;
                accuracyEl.textContent = accuracyRate.toFixed(1) + '%'; 
            }
        }
        
        // 函數：更新錯誤列表顯示 *** 新增 ***
        function updateErrorListDisplay() {
            if (errorList.length === 0) {
                errorSummaryEl.style.display = 'none';
                errorListEl.innerHTML = '';
                return;
            }

            // 清空舊列表
            errorListEl.innerHTML = ''; 
            
            // 重新繪製新列表
            errorList.forEach(item => {
                const listItem = document.createElement('li');
                listItem.textContent = item;
                errorListEl.appendChild(listItem);
            });

            errorSummaryEl.style.display = 'block'; // 顯示錯誤區塊
        }

        // 函數：生成新的乘數問題 (範圍：2到9)
        function generateQuestion() {
            startTime = Date.now();
            questionTimeEl.textContent = ''; 

            currentNum1 = Math.floor(Math.random() * 8) + 2;
            currentNum2 = Math.floor(Math.random() * 8) + 2;
            
            num1El.textContent = currentNum1;
            num2El.textContent = currentNum2;
            
            inputEl.value = '';
            resultMessageEl.textContent = '';
            resultMessageEl.className = 'message';
            
            inputEl.focus();
        }

        // 函數：檢查用戶的答案
        function checkAnswer() {
            const userAnswer = parseInt(inputEl.value);
            const correctAnswer = currentNum1 * currentNum2;
            const endTime = Date.now();
            
            if (isNaN(userAnswer)) {
                resultMessageEl.textContent = '請輸入一個有效的數字！';
                resultMessageEl.className = 'message wrong';
                inputEl.focus();
                return;
            }

            totalQuestions++;
            totalQuestionsEl.textContent = totalQuestions;
            
            const timeTaken = ((endTime - startTime) / 1000).toFixed(2); 
            let message = '';

            if (userAnswer === correctAnswer) {
                score++;
                scoreEl.textContent = score;
                message = '✅ 太棒了！答案正確！';
                resultMessageEl.className = 'message correct';
            } else {
                mistakes++; 
                mistakesEl.textContent = mistakes;
                
                // *** 關鍵修改：將錯題加入列表 ***
                const errorItem = `${currentNum1} × ${currentNum2} = ${correctAnswer} (你答 ${userAnswer})`;
                errorList.push(errorItem);
                updateErrorListDisplay(); // 更新顯示
                
                message = `❌ 錯了，正確答案是 ${correctAnswer}。`;
                resultMessageEl.className = 'message wrong';
            }
            
            updateAccuracy();

            resultMessageEl.textContent = message;
            questionTimeEl.textContent = `這題用時: ${timeTaken} 秒`;

            // 延遲一段時間後生成新問題
            setTimeout(generateQuestion, 2000); 
        }

        // 監聽 Enter 鍵
        inputEl.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        });

        // 網頁載入完成後
        window.onload = function() {
            totalTimerInterval = setInterval(updateTotalTime, 1000);
            generateQuestion();
            updateAccuracy();
            updateErrorListDisplay(); // 確保初始是隱藏的
        }
    </script>
</body>
</html>
